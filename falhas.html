<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Falha - Manutenção Industrial Flaviense</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="topbar no-print">
  <div class="marca"><div class="marca-lockup"><span class="logo-marca" role="img" aria-label="Manutenção Industrial Flaviense"></span><span class="pastilha">MANUTENÇÃO INDUSTRIAL</span></div> Controle de Equipamentos</div>
  <nav>
    <a href="equipamentos.html">Equipamentos</a>
    <a href="falhas.html">Registrar Falha</a>
    <a href="config.html">Configurações</a>
    <span class="usuario" id="nome-usuario"></span>
    <button class="sair" onclick="sair()">Sair</button>
  </nav>
</div>

<div class="layout-lateral">
  <nav class="menu-lateral no-print">
    <button type="button" class="item-menu-lateral ativo" id="menu-modo-registro" data-modo="registro">Registro de falha / intervenção</button>
    <button type="button" class="item-menu-lateral" id="menu-modo-branco" data-modo="branco">Formulário em Branco</button>
  </nav>

  <div class="container">
  <div class="cartao">
    <h2>Registrar falha / intervenção corretiva</h2>

    <div id="etapa-busca">
      <form id="form-busca-equipamento" class="form-inline">
        <div class="campo">
          <label for="busca-equipamento">Buscar equipamento por nome ou ID</label>
          <input type="text" id="busca-equipamento" placeholder="Ex: Compressor ou EQ-0001" autocomplete="off">
        </div>
        <button type="submit" class="botao botao-primario">🔍 Buscar</button>
      </form>
      <div id="lista-resultados" class="tabela-scroll"></div>
    </div>

    <div id="etapa-formulario" style="display:none;">
      <div class="cartao" style="background:#f8fafc;" id="bloco-equip-fixo">
        <strong id="equipamento-selecionado"></strong>
        <button type="button" class="botao botao-secundario botao-pequeno" id="btn-trocar" style="margin-left:0.8rem;">Trocar equipamento</button>
      </div>
      <div class="campo" id="bloco-equip-select" style="display:none;">
        <label for="falha-equipamento-select">Equipamento</label>
        <select id="falha-equipamento-select" required><option value="">Selecione um equipamento...</option></select>
      </div>
      <form id="form-falha">
        <div class="grid-2">
          <div class="campo">
            <label for="falha-data">Data da falha</label>
            <input type="date" id="falha-data" required>
          </div>
          <div class="campo">
            <label for="falha-registrado-por">Registrado por</label>
            <input type="text" id="falha-registrado-por" required>
          </div>
        </div>
        <div class="campo">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.3rem;">
            <label for="falha-descricao" style="margin-bottom:0;">Descrição da falha</label>
            <button type="button" class="botao botao-secundario botao-pequeno" id="btn-ditado">🎤 Ditar</button>
          </div>
          <textarea id="falha-descricao" rows="4" required placeholder="Digite ou use o botão Ditar para falar a descrição"></textarea>
          <div id="msg-ditado-indisponivel" class="vazio" style="display:none; margin-top:0.3rem; font-size:0.8rem;">Ditado por voz não é suportado neste navegador. Use Chrome ou Edge.</div>
        </div>

        <div class="campo">
          <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600; color:var(--texto);">
            <input type="checkbox" id="falha-parada" style="width:auto;">
            A falha gerou parada na produção?
          </label>
        </div>

        <div class="campo">
          <label>Manutenção realizada por</label>
          <div style="display:flex; gap:1.5rem; margin-top:0.3rem;">
            <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400;">
              <input type="radio" name="equipe" id="falha-equipe-propria" value="Propria" style="width:auto;" checked>
              Equipe própria
            </label>
            <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400;">
              <input type="radio" name="equipe" id="falha-equipe-terceirizada" value="Terceirizada" style="width:auto;">
              Equipe terceirizada
            </label>
          </div>
        </div>

        <div class="grid-2">
          <div class="campo" id="campo-empresa-terceirizada" style="display:none;">
            <label for="falha-empresa">Nome da empresa terceirizada</label>
            <input type="text" id="falha-empresa">
          </div>
          <div class="campo">
            <label for="falha-custo">Custo da intervenção (R$), se houver</label>
            <input type="number" id="falha-custo" min="0" step="0.01" placeholder="0,00">
          </div>
        </div>

        <button type="submit" class="botao botao-primario">Registrar falha</button>
        <span id="msg-ok" class="sucesso" style="display:none;">Falha registrada com sucesso.</span>
      </form>
    </div>
  </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/falhas.js"></script>
</body>
</html>
